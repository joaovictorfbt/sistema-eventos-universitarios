    <header><div class="container"><div class="logo">Eventos Universitários</div><nav><ul><li><a href="index.html">Home</a></li><li><a href="programacao.html">Programação</a></li><li><a href="inscricao.html">Inscrição</a></li></ul></nav></div></header>
    <main><section><div class="container"><h1 class="section-title">Inscrição em Evento</h1><form action="#" method="post"><div class="form-group"><label for="nome">Nome completo</label><input type="text" id="nome" name="nome" required></div><div class="form-group"><label for="email">E-mail</label><input type="email" id="email" name="email" required></div><div class="form-group"><label for="periodo">Período</label><select id="periodo" name="periodo" required><option value="">Selecione</option><option value="1">1º período</option><option value="2">2º período</option><option value="3">3º período</option><option value="4">4º período</option><option value="5">5º período</option><option value="6">6º período</option><option value="7">7º período</option><option value="8">8º período</option></select></div><div class="form-group"><label for="evento">Evento desejado</label><select id="evento" name="evento" required><option value="">Selecione um evento</option><option value="inovacao">Inovação e Tecnologia</option><option value="programacao">Introdução à Programação</option><option value="pesquisa">Pesquisa Acadêmica</option><option value="comunicacao">Comunicação e Apresentações</option><option value="projetos">Mostra de Projetos</option><option value="comunidade">Universidade e Comunidade</option></select></div><fieldset class="form-group"><legend>Modalidade</legend><div class="radio-group"><label><input type="radio" name="modalidade" value="presencial" required> Presencial</label><label><input type="radio" name="modalidade" value="online"> Online</label></div></fieldset><div class="form-group confirmation"><label><input type="checkbox" name="confirmacao" required> Confirmo que as informações preenchidas estão corretas.</label></div><button type="submit">Realizar inscrição</button></form></div></section></main>
